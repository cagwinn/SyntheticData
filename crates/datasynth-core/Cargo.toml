[package]
name = "datasynth-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core domain models, traits, and distributions for synthetic enterprise data generation"
keywords.workspace = true
categories.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
smallvec = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
llm = ["dep:reqwest"]
neural = ["dep:candle-core", "dep:candle-nn", "dep:safetensors"]
# v4.2.0+ — opt in to CUDA acceleration for the neural-diffusion
# backend. Requires drivers + CUDA toolkit; falls back to CPU at
# runtime if the GPU isn't available.
neural-cuda = ["neural", "candle-core/cuda", "candle-nn/cuda"]

[dependencies.reqwest]
workspace = true
optional = true

[dependencies.candle-core]
workspace = true
optional = true

[dependencies.candle-nn]
workspace = true
optional = true

[dependencies.safetensors]
workspace = true
optional = true

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
serde_yaml = { workspace = true }
