# DataSynth embedded defaults — v4.1.4+
#
# This file is bundled into `datasynth-core` via `include_str!` and
# loaded by `DefaultTemplateProvider::bundled()`. It extends (not
# replaces) the hardcoded `const &[&str]` arrays in the provider.
#
# This is the first step toward full YAML-as-source-of-truth
# migration (see `crates/datasynth-core/src/templates/
# YAML_AS_SOT_MIGRATION.md`). v4.1.4 ships the loader wiring; future
# v4.x releases progressively export the embedded arrays here.
#
# Keep entries sorted within each pool for byte-identical reproducibility.
# Entries are ADDITIVE — they supplement the embedded arrays, never replace.

