id: kyc_pkyc_review
name: Perpetual KYC Review
description: >
  Event-driven customer due-diligence refresh triggered by change events
  (address, beneficial owner, PEP status, adverse media, periodic anniversary)
  per AMLR and Wolfsberg RBA 2025.
primary_anchors:
  - eu_amlr_2024_1624
  - eu_eba_mltf_rf
  - wolfsberg_rba_2025
  - ch_amlo_finma
  - ch_cdb20
discriminator_profile:
  tiers: [edd, standard]
  overlays: [wealth_private_banking]
  jurisdictions: [ch]
procedures:
  - id: proc_trigger_detection
    name: Trigger Detection
    description: Detect and classify pKYC trigger events from upstream signals.
    obligation_refs:
      - obl:eu_amlr_2024_1624:26:5
      - obl:eu_eba_mltf_rf:4.77:0
    steps:
      - id: step_trg_catalog_match
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_trigger_detection
        description: Match incoming signal against the pKYC trigger catalog (anniversary, BO change, PEP change, adverse media, address change).
        obligation_refs:
          - obl:eu_amlr_2024_1624:26:5
          - obl:eu_eba_mltf_rf:4.77:0
          - obl:eu_eba_mltf_rf:4.77:1
        kind: trigger_event
        attrs:
          event_types:
            - periodic_anniversary
            - adverse_media_hit
            - pep_status_change
            - beneficial_owner_change
            - address_change
          debounce_hours: 24

      - id: step_trg_debounce
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_trigger_detection
        description: Debounce / deduplicate triggers within the rolling 24h window per customer and trigger type.
        obligation_refs:
          - obl:eu_eba_mltf_rf:4.73:1
          - obl:eu_amlr_2024_1624:26:7
        kind: generic

      - id: step_trg_materiality_flag
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_trigger_detection
        description: Flag trigger as material (full review) or non-material (no-op + log) based on type and risk tier.
        obligation_refs:
          - obl:eu_amlr_2024_1624:26:5
          - obl:eu_eba_mltf_rf:4.74:0
          - obl:eu_eba_mltf_rf:4.74:2
        kind: generic

      - id: step_trg_dispatch
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_trigger_detection
        description: Dispatch material triggers to materiality assessment procedure; log non-material ones in case file.
        obligation_refs:
          - obl:ch_amla_current:7:0
          - obl:wolfsberg_pb:P.9:0
        kind: generic

  - id: proc_materiality_assessment
    name: Materiality Assessment
    description: Assess whether the trigger materially changes the customer's risk profile.
    obligation_refs:
      - obl:eu_amlr_2024_1624:26:5
      - obl:eu_eba_mltf_rf:1.26:0
    steps:
      - id: step_mat_context_load
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_materiality_assessment
        description: Load current customer context (risk tier, last CDD snapshot, open alerts) from case file.
        obligation_refs:
          - obl:eu_amlr_2024_1624:26:3
          - obl:eu_eba_mltf_rf:1.28:0
        kind: generic

      - id: step_mat_risk_delta
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_materiality_assessment
        description: Compute delta between pre-trigger and post-trigger risk factors (customer, product, channel, geography).
        obligation_refs:
          - obl:eu_eba_mltf_rf:1.22:0
          - obl:eu_eba_mltf_rf:1.26:1
          - obl:eu_amlr_2024_1624:20:1
        kind: generic

      - id: step_mat_dispatch_or_noop
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_materiality_assessment
        description: Dispatch to full refresh (material) or record no-op (non-material) with reasoning.
        obligation_refs:
          - obl:eu_amlr_2024_1624:26:5
          - obl:eu_eba_mltf_rf:4.78:0
        kind: generic

      - id: step_mat_record
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_materiality_assessment
        description: Record materiality assessment outcome + supporting rationale in case file.
        obligation_refs:
          - obl:eu_amlr_2024_1624:21:6
          - obl:eu_amlr_2024_1624:21:7
          - obl:ch_amla_current:7:0
        kind: generic

      - id: step_mat_notify
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_materiality_assessment
        description: Notify relationship manager + compliance of material outcome; include SLA countdown.
        obligation_refs:
          - obl:wolfsberg_pb:P.4:1
          - obl:eu_eba_mltf_rf:4.73:1
        kind: generic

  - id: proc_refresh_cdd
    name: CDD Refresh
    description: Re-execute the portions of CDD that the trigger made stale.
    obligation_refs:
      - obl:eu_amlr_2024_1624:26:3
      - obl:eu_eba_mltf_rf:4.78:0
    steps:
      - id: step_ref_reidentify
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_refresh_cdd
        description: Re-identify the contracting partner if identification documents have lapsed or the ID data has changed.
        obligation_refs:
          - obl:ch_cdb20:46:0
          - obl:ch_cdb20:10:0
          - obl:eu_amlr_2024_1624:22:9
        kind: generic

      - id: step_ref_recollect_bo
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_refresh_cdd
        description: Re-collect beneficial-owner declaration on BO-change triggers (Form A refresh / register cross-check).
        obligation_refs:
          - obl:ch_cdb20:27:0
          - obl:ch_amla_current:4:0
          - obl:eu_amlr_2024_1624:22:0
        kind: generic

      - id: step_ref_recollect_sow
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_refresh_cdd
        description: Re-collect source-of-wealth documentation where plausibility has been undermined by the trigger.
        obligation_refs:
          - obl:eu_eba_mltf_rf:4.50:0
          - obl:eu_amlr_2024_1624:34:3
          - obl:wolfsberg_pb:P.1:3
        kind: source_of_wealth
        attrs:
          document_types: [tax_return, salary_slip, business_sale_agreement, inheritance_deed, dividend_statement]
          minimum_documents: 2
          freshness_days: 365

      - id: step_ref_rescreen
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_refresh_cdd
        description: Re-run sanctions + PEP + adverse-media screening against the updated customer and BO data.
        obligation_refs:
          - obl:wolfsberg_sms:P.1:1
          - obl:eu_amlr_2024_1624:26:8
          - obl:eu_eba_mltf_rf:4.49:1
        kind: generic

      - id: step_ref_redocument
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_refresh_cdd
        description: Update CDD documents, data and information to reflect all refreshed attributes.
        obligation_refs:
          - obl:eu_amlr_2024_1624:26:3
          - obl:eu_amlr_2024_1624:21:7
          - obl:eu_eba_mltf_rf:4.76:0
        kind: generic

      - id: step_ref_record
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_refresh_cdd
        description: Record refreshed CDD package + retain prior snapshot for audit trail.
        obligation_refs:
          - obl:wolfsberg_pb:P.9:0
          - obl:ch_amla_current:7:0
          - obl:eu_amlr_2024_1624:21:6
        kind: generic

  - id: proc_re_rating
    name: Risk Re-rating
    description: Recompute inherent, controls, and residual risk using refreshed CDD data.
    obligation_refs:
      - obl:eu_amlr_2024_1624:20:1
      - obl:eu_eba_mltf_rf:1.26:1
    steps:
      - id: step_rr_inherent_recompute
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_re_rating
        description: Recompute inherent risk using updated customer, product, channel and geography factors.
        obligation_refs:
          - obl:eu_amlr_2024_1624:20:1
          - obl:eu_eba_mltf_rf:1.22:0
        kind: risk_scoring
        attrs:
          model: amlr_inherent_controls_residual
          inputs: [customer_type, product, channel, geography]
          output_field: inherent_risk
          thresholds: {edd_threshold: 0.6, sdd_threshold: 0.2}

      - id: step_rr_controls_recompute
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_re_rating
        description: Recompute controls strength given the refreshed CDD evidence and any new mitigations.
        obligation_refs:
          - obl:eu_amlr_2024_1624:20:2
          - obl:eu_eba_mltf_rf:4.74:0
        kind: risk_scoring
        attrs:
          model: amlr_inherent_controls_residual
          inputs: [controls_catalog]
          output_field: controls_strength

      - id: step_rr_residual_recompute
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_re_rating
        description: Recompute residual risk = Inherent x Controls and branch on the EDD threshold.
        obligation_refs:
          - obl:eu_amlr_2024_1624:20:4
          - obl:eu_eba_mltf_rf:1.25:2
          - obl:eu_amlr_2024_1624:34:0
        kind: risk_scoring
        attrs:
          model: amlr_inherent_controls_residual
          inputs: [inherent_risk, controls_strength]
          output_field: residual_risk
          thresholds: {edd_threshold: 0.7}
        decisions:
          - id: dp_residual_tier_branch
            condition: {kind: numeric, expression: "customer.residual_risk > 0.7"}
            if_true_next: step_rr_tier_decision
            if_false_next: step_odp_close_noaction

      - id: step_rr_tier_decision
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_re_rating
        description: Record tier decision (unchanged / upgraded / downgraded) and attach supporting rationale.
        obligation_refs:
          - obl:eu_amlr_2024_1624:20:5
          - obl:eu_eba_mltf_rf:1.25:0
          - obl:eu_amlr_2024_1624:21:7
        kind: generic

  - id: proc_outcome_disposition
    name: Outcome Disposition
    description: Close, escalate, or exit the relationship based on re-rating outcome.
    obligation_refs:
      - obl:eu_amlr_2024_1624:21:0
      - obl:wolfsberg_pb:P.2:0
    steps:
      - id: step_odp_close_noaction
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_outcome_disposition
        description: Close review with no action when residual risk is unchanged and CDD remains satisfactory.
        obligation_refs:
          - obl:eu_amlr_2024_1624:26:5
          - obl:eu_amlr_2024_1624:21:7
          - obl:ch_amla_current:7:0
        kind: generic

      - id: step_odp_escalate_senior_mgmt
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_outcome_disposition
        description: Escalate to senior management for sign-off on elevated or newly-EDD customers (including PEP status changes).
        obligation_refs:
          - obl:wolfsberg_pb:P.2:0
          - obl:wolfsberg_pb:P.2:1
          - obl:wolfsberg_pb:P.3:1
          - obl:eu_eba_mltf_rf:4.50:3
        kind: approval_gate
        attrs:
          required_role: senior_management
          escalation_chain: [mlro]
          sla_hours: 120

      - id: step_odp_exit_record
        blueprint_ref: kyc_pkyc_review
        procedure_ref: proc_outcome_disposition
        description: Exit relationship where risk appetite is exceeded; record rationale and retain file per retention rules.
        obligation_refs:
          - obl:eu_amlr_2024_1624:21:0
          - obl:eu_amlr_2024_1624:21:3
          - obl:eu_amlr_2024_1624:21:6
          - obl:wolfsberg_pb:P.9:0
        kind: generic

liveness_formulas:
  - "□(trigger_event → ◇ review_complete)"
  - "□(pep_status_changed → ◇ senior_mgmt_reviewed)"
  - "□(high_risk_event ∧ ¬refresh_within_90d → escalated)"
