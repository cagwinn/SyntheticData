        field_type: text
        is_required: false
        canonical_term: pta_controls_description
        obligation_refs:
          - "obl:wolfsberg_cb:P.9:0"

      - field_id: q2_8_cash_intensive_customers
        label: "Does the institution serve cash-intensive business customers?"
        field_type: boolean
        is_required: true
        canonical_term: cash_intensive_customers
        obligation_refs:
          - "obl:eu_amlr_2024_1624:79:0"
          - "obl:fatf_40:R.20:0"

      - field_id: q2_9_msb_customers
        label: "Does the institution maintain accounts for money service businesses (MSBs / MTO)?"
        field_type: boolean
        is_required: true
        canonical_term: msb_customers
        obligation_refs:
          - "obl:wolfsberg_cb:P.2:0"
          - "obl:fatf_40:R.18:0"
          - "obl:eu_amlr_2024_1624:80:0"

      - field_id: q2_10_crypto_customers
        label: "Does the institution maintain accounts for crypto-asset service providers (CASPs / VASPs)?"
        field_type: boolean
        is_required: true
        canonical_term: crypto_casp_customers
        obligation_refs:
          - "obl:eu_amlr_2024_1624:80:0"
          - "obl:fatf_40:R.18:0"

      - field_id: q2_11_shell_company_policy
        label: "Does the institution have a specific policy for shell companies / special purpose vehicles?"
        field_type: boolean
        is_required: true
        canonical_term: shell_company_policy
        obligation_refs:
          - "obl:wolfsberg_cb:P.7:0"
          - "obl:eu_amlr_2024_1624:34:0"

  - section_id: s3_aml_ctf_sanctions_programme
    title: "AML, CTF & Sanctions Programme"
