          - "obl:fatf_40:R.18:0"
          - "obl:eu_amlr_2024_1624:20:0"

      - field_id: q3_5_sanctions_screening_tool
        label: "Name the primary sanctions screening tool(s) used"
        field_type: text
        is_required: true
        canonical_term: sanctions_screening_tool
        obligation_refs:
