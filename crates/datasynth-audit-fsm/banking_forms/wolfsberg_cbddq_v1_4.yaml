          - "obl:wolfsberg_cb:P.2:0"

      - field_id: q2_4_payment_message_types
        label: "Payment message types used (e.g. SWIFT MT, MX/ISO 20022, SEPA)"
        field_type: enum_multi
        is_required: true
        canonical_term: payment_message_types
        enum_values:
          - swift_mt
          - swift_mx_iso20022
          - sepa_credit_transfer
          - sepa_direct_debit
          - rtgs
          - ach
          - other
        obligation_refs:
          - "obl:wolfsberg_pts:P.13:0"

      - field_id: q2_5_payable_through_accounts
        label: "Does the institution offer payable-through accounts to third parties?"
        field_type: boolean
        is_required: true
        canonical_term: payable_through_accounts
        obligation_refs:
          - "obl:wolfsberg_cb:P.9:0"
          - "obl:fatf_40:R.18:0"

      - field_id: q2_6_nested_correspondents
        label: "Does the institution offer correspondent services to other respondent banks (nested correspondents)?"
        field_type: boolean
        is_required: true
        canonical_term: nested_correspondents
        obligation_refs:
          - "obl:wolfsberg_cb:P.9:0"
          - "obl:fatf_40:R.18:0"

      - field_id: q2_7_pta_controls
        label: >
          If payable-through or nested correspondent accounts are offered,
