          - "obl:fatf_40:R.18:0"
          - "obl:eu_amlr_2024_1624:20:0"

      - field_id: q3_11_sanctions_escalation_procedure
        label: "Does the institution have a documented sanctions escalation / OFAC compliance procedure?"
