# Wolfsberg Correspondent Banking Due Diligence Questionnaire (CBDDQ) v1.4
# Public-source reconstruction based on the publicly-documented Wolfsberg Group
# CBDDQ structure (https://www.wolfsberg-principles.com/sites/default/files/wb/pdfs/wolfsberg-standards/Wolfsberg_CBDDQ_v1.4.pdf).
# This file contains the SCHEMA of the questionnaire; actual answers supplied
# by respondent banks are out of scope for this ontology.
#
# Obligation slug conventions:
#   obl:wolfsberg_cb:P.<n>:0   — Wolfsberg CB Principles paragraph n
#   obl:fatf_40:R.<n>:0        — FATF 40 Recommendation n
#   obl:eu_amlr_2024_1624:<n>:0 — EU AMLR 2024/1624 Article n

form_id: wolfsberg_cbddq_v1_4
name: Wolfsberg Correspondent Banking Due Diligence Questionnaire
version: "1.4"
kind: correspondent_banking_questionnaire
source: wolfsberg
description: >
  The Wolfsberg CBDDQ is the industry-standard questionnaire used by
  respondent banks to disclose their AML/CTF/Sanctions compliance programme
  to correspondent banks.  Sections cover entity identity, product exposure,
  and the full AML programme lifecycle.
public_url: "https://www.wolfsberg-principles.com/sites/default/files/wb/pdfs/wolfsberg-standards/Wolfsberg_CBDDQ_v1.4.pdf"
is_public_reconstruction: true

sections:

  - section_id: s1_entity_ownership
    title: "Entity & Ownership"
    description: >
      Basic corporate identity, ownership structure, regulatory authorisation,
      and public-listing status of the respondent institution.
    fields:
      - field_id: q1_1_legal_name
        label: "Full legal name of the institution"
        field_type: text
        is_required: true
        canonical_term: legal_entity_name
        obligation_refs:
          - "obl:wolfsberg_cb:P.2:0"
          - "obl:fatf_40:R.10:0"

      - field_id: q1_2_country_of_incorporation
        label: "Country of incorporation / registration"
        field_type: text
        is_required: true
        canonical_term: country_of_incorporation
        obligation_refs:
          - "obl:wolfsberg_cb:P.2:0"
          - "obl:fatf_40:R.10:0"

      - field_id: q1_3_primary_supervisor
        label: "Name of primary financial services supervisor / regulator"
        field_type: text
        is_required: true
        canonical_term: primary_regulator
        obligation_refs:
          - "obl:wolfsberg_cb:P.2:0"
          - "obl:eu_amlr_2024_1624:20:0"

      - field_id: q1_4_swift_bic
        label: "SWIFT BIC code"
        field_type: text
        is_required: true
        canonical_term: swift_bic
        obligation_refs:
          - "obl:wolfsberg_cb:P.2:0"

      - field_id: q1_5_lei
        label: "Legal Entity Identifier (LEI)"
        field_type: text
        is_required: false
        canonical_term: legal_entity_identifier
        obligation_refs:
          - "obl:wolfsberg_cb:P.2:0"

      - field_id: q1_6_is_publicly_listed
        label: "Is the institution publicly listed on a recognised stock exchange?"
        field_type: boolean
        is_required: true
        canonical_term: publicly_listed
        obligation_refs:
          - "obl:wolfsberg_cb:P.2:0"
          - "obl:fatf_40:R.12:0"

      - field_id: q1_7_stock_exchange_ticker
        label: "If publicly listed, stock exchange name and ticker symbol"
        field_type: text
        is_required: false
        canonical_term: stock_exchange_ticker
        obligation_refs:
          - "obl:wolfsberg_cb:P.2:0"

      - field_id: q1_8_ubo_threshold
        label: >
          Identify all beneficial owners (natural persons) holding 25% or more
          of shares / voting rights, or exercising equivalent control
        field_type: list
        is_required: true
        canonical_term: beneficial_owner_above_threshold
        obligation_refs:
          - "obl:wolfsberg_cb:P.7:0"
          - "obl:fatf_40:R.10:0"
          - "obl:eu_amlr_2024_1624:34:0"

      - field_id: q1_9_ownership_chart_available
        label: "Is a current ownership / corporate structure chart available on request?"
        field_type: boolean
        is_required: true
        canonical_term: ownership_chart_available
        obligation_refs:
          - "obl:wolfsberg_cb:P.7:0"
          - "obl:eu_amlr_2024_1624:34:0"

      - field_id: q1_10_holding_company_name
        label: "Name of ultimate parent / holding company (if applicable)"
        field_type: text
        is_required: false
        canonical_term: ultimate_parent_name
        obligation_refs:
          - "obl:wolfsberg_cb:P.2:0"

      - field_id: q1_11_year_established
        label: "Year the institution was established"
        field_type: numeric
        is_required: true
        canonical_term: year_established
        obligation_refs:
          - "obl:wolfsberg_cb:P.2:0"

  - section_id: s2_products_services
    title: "Products & Services"
    description: >
      Customer segments served, geographic markets, product and payment-channel
