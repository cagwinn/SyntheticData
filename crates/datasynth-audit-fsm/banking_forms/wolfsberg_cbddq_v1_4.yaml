          - sme
          - large_corporate
          - financial_institutions
          - governments_public_sector
          - non_profit_ngo
          - money_service_businesses
          - crypto_asset_service_providers
        obligation_refs:
          - "obl:wolfsberg_cb:P.2:0"
          - "obl:eu_amlr_2024_1624:20:0"

      - field_id: q2_2_geographic_markets
        label: "List the primary countries / jurisdictions in which the institution operates"
        field_type: list
        is_required: true
        canonical_term: geographic_markets
        obligation_refs:
          - "obl:wolfsberg_cb:P.2:0"
          - "obl:fatf_40:R.18:0"

      - field_id: q2_3_products_offered
        label: "Core banking products offered (select all that apply)"
        field_type: enum_multi
        is_required: true
        canonical_term: products_offered
        enum_values:
          - correspondent_banking
