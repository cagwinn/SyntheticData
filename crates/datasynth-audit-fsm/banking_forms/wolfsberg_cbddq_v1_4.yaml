        is_required: true
        canonical_term: aml_compliance_officer
        obligation_refs:
          - "obl:wolfsberg_cb:P.7:0"
          - "obl:fatf_40:R.18:0"

      - field_id: q3_3_mlro_reports_to
        label: "To whom does the MLRO / Compliance Officer report (board, CEO, general counsel)?"
