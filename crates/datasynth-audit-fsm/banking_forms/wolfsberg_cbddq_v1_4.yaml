      - field_id: q3_1_written_aml_policy
        label: "Does the institution maintain a written AML/CTF policy approved by senior management?"
        field_type: boolean
        is_required: true
        canonical_term: written_aml_policy
        obligation_refs:
          - "obl:wolfsberg_cb:P.7:0"
          - "obl:fatf_40:R.18:0"
          - "obl:eu_amlr_2024_1624:21:0"

      - field_id: q3_2_bsa_aml_officer_name
        label: "Name and title of the BSA/AML Compliance Officer (or equivalent)"
