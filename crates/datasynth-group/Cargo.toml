datasynth-generators = { workspace = true }
datasynth-runtime = { workspace = true }
datasynth-standards = { workspace = true }
datasynth-output = { workspace = true }
datasynth-audit-fsm = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
strsim = "0.11"
rayon = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }

[dev-dependencies]
datasynth-test-utils = { workspace = true }
rust_decimal_macros = { workspace = true }
pretty_assertions = "1"
tempfile = { workspace = true }
smallvec = { workspace = true }
uuid = { workspace = true }
# Subprocess-based determinism harness in `tests/determinism_in_process.rs`
# (Task 11.4) drives the `datasynth-data` CLI binary as a subprocess.
# `assert_cmd` is used for ergonomics; the binary itself is discovered
# via `CARGO_TARGET_DIR / target/debug/datasynth-data` (the test is
# `#[ignore]`d and run on the XXL VM, where the binary is built first).
assert_cmd = "2.2"
