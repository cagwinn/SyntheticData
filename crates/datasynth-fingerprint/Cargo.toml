[package]
name = "datasynth-fingerprint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Privacy-preserving synthetic data fingerprinting for DataSynth"
keywords = ["synthetic-data", "fingerprint", "privacy", "differential-privacy"]
categories = ["simulation", "cryptography"]

[dependencies]
# Internal crates
datasynth-core = { workspace = true }
datasynth-eval = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Archive format
zip = "8.5"

# SP6.1 — multi-pattern literal matching for PiiDenylist (single-pass
# replacement across thousands of literal proper-noun spans).
aho-corasick = { workspace = true }

# Date/Time
chrono = { workspace = true }

# Numeric
rust_decimal = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Random & Statistics
rand = { workspace = true }
rand_chacha = { workspace = true }

# Checksums
sha2 = { workspace = true }
hex = { workspace = true }

# Logging
tracing = { workspace = true }

# CSV parsing for data extraction
csv = { workspace = true }

# Parquet support
parquet = { workspace = true }
arrow = { workspace = true }

# UUID
uuid = { workspace = true }

# Regex for pattern matching
regex-lite = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
rust_decimal_macros = { workspace = true }
