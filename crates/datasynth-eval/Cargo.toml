[package]
name = "datasynth-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Evaluation framework for synthetic financial data quality and coherence"
keywords = ["evaluation", "data-quality", "benford", "statistical-testing", "synthetic-data"]
categories.workspace = true

[dependencies]
# Internal crates
datasynth-core = { workspace = true }

# Numeric
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }

# Statistics
statrs = "0.18"

# Date/Time
chrono = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Parallel processing

# Behavioral fidelity
arrow = { workspace = true }
parquet = { workspace = true }
petgraph = { workspace = true }
csv = { workspace = true }

[features]
adversarial = ["dep:ort", "dep:rand", "dep:rand_chacha", "dep:rand_distr"]

[dependencies.ort]
version = "2.0.0-rc.12"
optional = true

[dependencies.rand]
workspace = true
optional = true

[dependencies.rand_chacha]
workspace = true
optional = true

[dependencies.rand_distr]
workspace = true
optional = true

[dev-dependencies]
datasynth-test-utils = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }

