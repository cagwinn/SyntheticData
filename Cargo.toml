[workspace]
resolver = "2"
members = [
    "crates/datasynth-core",
    "crates/datasynth-config",
    "crates/datasynth-generators",
    "crates/datasynth-output",
    "crates/datasynth-runtime",
    "crates/datasynth-cli",
    "crates/datasynth-graph",
    "crates/datasynth-server",
    "crates/datasynth-test-utils",
    "crates/datasynth-eval",
    "crates/datasynth-ocpm",
    "crates/datasynth-audit-fsm",
    "crates/datasynth-audit-optimizer",
    "crates/datasynth-banking",
    "crates/datasynth-fingerprint",
    "crates/datasynth-standards",
    "crates/datasynth-group",
]
exclude = ["fuzz", "attic/datasynth-graph-export"]

# Root package for workspace-level benchmarks
[package]
name = "datasynth-workspace"
version = "5.37.0"
edition = "2021"
publish = false

[dev-dependencies]
datasynth-core = { path = "crates/datasynth-core" }
datasynth-config = { path = "crates/datasynth-config" }
datasynth-generators = { path = "crates/datasynth-generators" }
datasynth-output = { path = "crates/datasynth-output" }
datasynth-runtime = { path = "crates/datasynth-runtime" }
criterion = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }

[workspace.package]
version = "5.37.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
authors = ["Michael Ivertowski"]
repository = "https://github.com/mivertowski/SyntheticData"
homepage = "https://github.com/mivertowski/SyntheticData"
documentation = "https://github.com/mivertowski/SyntheticData"
description = "High-performance synthetic data generator for enterprise accounting data"
keywords = ["synthetic-data", "accounting", "financial", "test-data", "data-generation"]
categories = ["simulation", "command-line-utilities"]

[workspace.dependencies]
# Internal crates - version required for crates.io publishing
# Version must match workspace.package.version to prevent cargo from resolving
# old incompatible versions during publish verification
datasynth-core = { version = "5.36.0", path = "crates/datasynth-core" }
datasynth-config = { version = "5.36.0", path = "crates/datasynth-config" }
datasynth-generators = { version = "5.36.0", path = "crates/datasynth-generators" }
datasynth-output = { version = "5.36.0", path = "crates/datasynth-output" }
datasynth-runtime = { version = "5.36.0", path = "crates/datasynth-runtime" }
datasynth-graph = { version = "5.36.0", path = "crates/datasynth-graph" }
datasynth-server = { version = "5.36.0", path = "crates/datasynth-server" }
datasynth-test-utils = { version = "5.36.0", path = "crates/datasynth-test-utils" }
datasynth-eval = { version = "5.36.0", path = "crates/datasynth-eval" }
datasynth-ocpm = { version = "5.36.0", path = "crates/datasynth-ocpm" }
datasynth-banking = { version = "5.36.0", path = "crates/datasynth-banking" }
datasynth-fingerprint = { version = "5.36.0", path = "crates/datasynth-fingerprint" }
datasynth-standards = { version = "5.36.0", path = "crates/datasynth-standards" }
datasynth-audit-fsm = { version = "5.36.0", path = "crates/datasynth-audit-fsm" }
datasynth-audit-optimizer = { version = "5.36.0", path = "crates/datasynth-audit-optimizer" }
datasynth-group = { version = "5.36.0", path = "crates/datasynth-group" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Hashing
sha2 = "0.11"
hex = "0.4"
blake3 = "1"

# Numeric - precise decimal arithmetic for financial calculations
rust_decimal = { version = "1.36", features = ["serde", "serde-with-str", "maths"] }
rust_decimal_macros = "1.36"

# Random & Statistics
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
statrs = "0.18"

# Async runtime
tokio = { version = "1.51", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# gRPC
tonic = "0.14"
tonic-build = "0.14"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"

# HTTP/REST
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }

# Data formats - Arrow/Parquet for analytics-ready output
arrow = { version = "58", features = ["prettyprint"] }
parquet = { version = "58", features = ["arrow", "async", "zstd", "lz4", "snap"] }
csv = "1.3"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }

# UUID for document identifiers
uuid = { version = "1.23", features = ["v4", "v5", "v7", "serde"] }

# CLI
clap = { version = "4.6", features = ["derive", "env", "string"] }
indicatif = { version = "0.18", features = ["rayon"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Security
argon2 = "0.5"
subtle = "2.6"

# OpenTelemetry (optional)
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry-prometheus = "0.32"
prometheus = "0.14"
tracing-opentelemetry = "0.32"

# Fast number formatting
itoa = "1.0"
ryu = "1.0"

# Compression
zstd = "0.13"

# Data structures
smallvec = { version = "1.13", features = ["serde"] }
petgraph = "0.8"

# Parallel processing
rayon = "1.12"
num_cpus = "1.16"
crossbeam-channel = "0.5"

# Signal handling
signal-hook = "0.4"

# HTTP client (streaming export)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Regex
regex = "1.11"
# Aho-Corasick multi-pattern literal matcher (SP6.1: used by PiiDenylist for
# single-pass replacement of thousands of literal proper-noun spans).
aho-corasick = "1.1"

# ML framework (optional — neural diffusion backend)
candle-core = "0.10"
candle-nn = "0.10"
safetensors = "0.7"

# ONNX Runtime (optional — adversarial testing)
ort = "2.0.0-rc.12"

# JWT (optional - OIDC token validation)
jsonwebtoken = "10"

# Redis (optional - distributed rate limiting)
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }

# TLS
axum-server = { version = "0.8", features = ["tls-rustls"] }

# Testing
proptest = "1.11"
tempfile = "3.26"
assert_cmd = "2.2"
predicates = "3.0"

# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.bench]
lto = true
codegen-units = 1

# Workspace-level benchmarks
[[bench]]
name = "generation_throughput"
harness = false

[[bench]]
name = "distribution_sampling"
harness = false

[[bench]]
name = "output_sinks"
harness = false

[[bench]]
name = "scalability"
harness = false

[[bench]]
name = "correctness"
harness = false
