name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Exclude graph-export (requires private sibling repo)
        run: sed -i '/"crates\/datasynth-graph-export",/d' Cargo.toml
      - run: cargo fmt --all -- --check

  template_drift:
    name: Template Drift Gate (v3.2.1+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check no new hardcoded name/description pools + CLAUDE.md crate count
        run: ./scripts/check_template_drift.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Exclude graph-export (requires private sibling repo)
        run: sed -i '/"crates\/datasynth-graph-export",/d' Cargo.toml
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Exclude graph-export (requires private sibling repo)
        run: grep -v '"crates/datasynth-graph-export"' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
        shell: bash
      # `--workspace` is required: the root Cargo.toml is BOTH a
      # `[workspace]` and a `[package]`. Without it, `cargo test` only
      # exercises the root package's targets and silently skips every
      # workspace-member integration test (e.g. `manifest_golden`,
      # `flat_export_smoke`) — regressions there would only surface in
      # the slower Code Coverage job. Discovered during v5.0.1 (Gap 5).
      #
      # `datasynth-server` is excluded for the same reason the Code
      # Coverage job excludes it: its gRPC integration tests
      # (`test_bulk_generate_*`) take 5-10 min each under debug builds
      # and push the cumulative job past the runner's time budget.
      # Server-specific coverage is exercised by `--lib` runs in the
      # feature-matrix workflow.
      #
      # On `ubuntu-latest` (2 vCPU / 7 GB RAM) the cumulative memory
      # pressure of the integration test suite exhausts the runner
      # before the suite completes — the agent is then cancelled by
      # the GitHub Actions infrastructure ("hosted runner lost
      # communication with the server"). The biggest contributors are
      # `datasynth-cli/tests/*.rs` (each spawns `synth-data generate`
      # as a subprocess with `--memory-limit 512` and several run in
      # parallel by default) but also `datasynth-runtime/tests/*.rs`
      # (in-process orchestrator runs) and a few other crates. macOS
      # (14 GB) and Windows (16 GB) runners are unaffected.
      #
      # Workaround: on Linux, run only `--lib --bins` (unit tests +
      # binary tests, no integration tests). The integration tests
      # still get full cross-platform coverage on macOS + Windows
      # via `--all-targets`. See GitHub issue #184.
      - name: Workspace tests (Linux — lib + bin only, integration runs on macOS/Windows)
        if: runner.os == 'Linux'
        run: cargo test --workspace --exclude datasynth-server --lib --bins
      - name: Workspace tests (macOS / Windows — full integration suite)
        if: runner.os != 'Linux'
        run: cargo test --workspace --exclude datasynth-server --all-targets

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Exclude graph-export (requires private sibling repo)
        run: sed -i '/"crates\/datasynth-graph-export",/d' Cargo.toml
      - run: cargo check --workspace

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Exclude graph-export (requires private sibling repo)
        run: sed -i '/"crates\/datasynth-graph-export",/d' Cargo.toml
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny check
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo-audit
        run: cargo audit --ignore RUSTSEC-2024-0437 --ignore RUSTSEC-2024-0429

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Exclude graph-export (requires private sibling repo)
        run: sed -i '/"crates\/datasynth-graph-export",/d' Cargo.toml
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage
        # Same rationale as the matrix Test job: ubuntu-latest's
        # 2 vCPU / 7 GB RAM cannot host the integration test suite
        # under llvm-cov instrumentation ("hosted runner lost
        # communication with the server"). Restrict to `--lib --bins`
        # to keep memory pressure bounded; integration coverage is
        # exercised on macOS + Windows in the matrix Test job (which
        # have 14-16 GB RAM). See GitHub issue #184.
        run: cargo llvm-cov --workspace --exclude datasynth-server --lib --bins --lcov --output-path lcov.info
        timeout-minutes: 60
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  benchmarks:
    name: Benchmark Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Exclude graph-export (requires private sibling repo)
        run: sed -i '/"crates\/datasynth-graph-export",/d' Cargo.toml
      - name: Run benchmarks (smoke test)
        run: cargo bench --bench generation_throughput -- --sample-size 10
