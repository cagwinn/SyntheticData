# Recession Scenario
#
# GDP contracts, revenue declines 15-25%, bad debt expense increases,
# vendor defaults occur. Cash flow pressure forces cost-cutting.

scenarios:
  enabled: true
  scenarios:
    - name: recession_2008_replay
      description: >
        GDP growth turns negative in month 4. Revenue declines 15-25% over
        the following 8 months. Bad debt expense increases 3x. Three strategic
        vendors default. Cash flow pressure forces delayed payments.
      tags: [macro, recession, stress_test, economic_cycle]
      probability_weight: 0.10
      interventions:
        - type: parameter_shift
          target: distributions.amounts.components[0].mu
          value: "5.5"
          timing:
            start_month: 4
            duration_months: 8
            onset: gradual
          label: "Revenue decline — reduced transaction amounts"
        - type: parameter_shift
          target: transactions.anomaly_rate
          value: "0.04"
          timing:
            start_month: 6
            duration_months: 6
            onset: gradual
          label: "Increased errors from cost-cutting and stress"
      constraints:
        preserve_accounting_identity: true
        preserve_document_chains: true
        preserve_period_close: true
      output:
        paired: true
        diff_formats: [summary, aggregate]
