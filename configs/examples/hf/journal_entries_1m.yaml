# VynFi Journal Entries — HF dataset regeneration config
#
# v5.27.0 (current): regeneration adds the community-requested fine-grained
#   fraud-typology column. No config change needed — the engine emits
#   `fraud_type` (FraudType variant, e.g. SuspenseAccountAbuse / SplitTransaction
#   / FictitiousTransaction / RevenueManipulation) + `anomaly_type` since
#   v5.17.0, and scripts/hf_to_parquet.py carries them through. JE table is now
#   46 columns (was 38 at v5.5.1 / 43 at v5.9.0). je_network defaults to
#   Method A (set explicitly below). Published dataset: 1,058,941 lines,
#   5.82% is_fraud, 20 fraud_type categories.
#
# Changes since v5.5.1 baseline:
#   v5.6.0  ISO 21378 account-class / sub-class fields
#           (account_class_name, account_sub_class, account_sub_class_name)
#   v5.7.0  Industry sub-account expansion (opt-in, enabled below) — splits
#           canonical control accounts into product-line / channel /
#           cost-centre sub-accounts for a more realistic chart
#   v5.8.0  graphs/je_network.csv flat edge-list export (Cartesian-product
#           debit↔credit edges) + JournalEntryLine.predecessor_line_id for
#           document-chain tracing (P2P / O2C predecessor lookup)
#   v5.8.0  BenfordViolationStrategy magnitude bug fixed (#185) — fraud
#           amounts no longer inflate to quintillion scale
#   v5.8.0  Distribution-struct silent-drop drift closed (#183) — typos in
#           fraud_type / behavior / credit-rating distributions now fail
#           parse with `unknown field` instead of silently dropping

global:
  industry: manufacturing
  start_date: "2024-01-01"
  period_months: 12
  seed: 20260507
  group_currency: USD
  parallel: true
  worker_threads: 4
  memory_limit_mb: 8192

companies:
  - { code: "1000", name: "VynFi Mfg HQ",        currency: USD, country: US, annual_transaction_volume: hundred_k, volume_weight: 0.18, fiscal_year_variant: K4 }
  - { code: "1100", name: "VynFi Mfg Plant 1",   currency: USD, country: US, annual_transaction_volume: hundred_k, volume_weight: 0.14, fiscal_year_variant: K4 }
  - { code: "1200", name: "VynFi Mfg Plant 2",   currency: USD, country: US, annual_transaction_volume: hundred_k, volume_weight: 0.12, fiscal_year_variant: K4 }
  - { code: "1300", name: "VynFi Mfg Plant 3",   currency: USD, country: US, annual_transaction_volume: hundred_k, volume_weight: 0.10, fiscal_year_variant: K4 }
  - { code: "2000", name: "VynFi Mfg EU GmbH",   currency: EUR, country: DE, annual_transaction_volume: hundred_k, volume_weight: 0.10, fiscal_year_variant: K4 }
  - { code: "2100", name: "VynFi Mfg UK Ltd",    currency: GBP, country: GB, annual_transaction_volume: hundred_k, volume_weight: 0.08, fiscal_year_variant: K4 }
  - { code: "2200", name: "VynFi Mfg FR SAS",    currency: EUR, country: FR, annual_transaction_volume: hundred_k, volume_weight: 0.08, fiscal_year_variant: K4 }
  - { code: "3000", name: "VynFi Mfg APAC SG",   currency: SGD, country: SG, annual_transaction_volume: hundred_k, volume_weight: 0.08, fiscal_year_variant: K4 }
  - { code: "3100", name: "VynFi Mfg AU Pty",    currency: AUD, country: AU, annual_transaction_volume: hundred_k, volume_weight: 0.06, fiscal_year_variant: K4 }
  - { code: "4000", name: "VynFi Mfg CA Inc",    currency: CAD, country: CA, annual_transaction_volume: hundred_k, volume_weight: 0.06, fiscal_year_variant: K4 }

chart_of_accounts:
  complexity: medium
  industry_specific: true
  min_hierarchy_depth: 2
  max_hierarchy_depth: 4

master_data:
  vendors:   { count: 300, intercompany_percent: 0.15 }
  customers: { count: 600, intercompany_percent: 0.10 }
  materials: { count: 1500, bom_enabled: true, average_bom_depth: 3 }
  fixed_assets: { count: 150 }
  employees:    { count: 200 }

document_flows:
  p2p:
    enabled: true
    chains_per_month: 1500
    three_way_match_rate: 0.92
    partial_delivery_rate: 0.12
    gr_ir_clearing_enabled: true
  o2c:
    enabled: true
    chains_per_month: 2000
    credit_check_failure_rate: 0.04
    partial_shipment_rate: 0.10
    return_rate: 0.025

balance:
  generate_opening_balances: true
  generate_trial_balances: true
  reconcile_subledgers: true
  validate_balance_equation: true
  target_gross_margin: 0.32
  target_dso_days: 45
  target_dpo_days: 30

period_close:
  enabled: true

financial_reporting:
  enabled: true
  generate_balance_sheet: true
  generate_income_statement: true
  generate_cash_flow: true

# 6-7% line-level fraud (matches the published 6.92%), with a behavioural
# bias on every is_fraud line (weekend / round-dollar / off-hours / post-close).
fraud:
  enabled: true
  fraud_rate: 0.05
  document_fraud_rate: 0.07
  propagate_to_lines: true

# 21% manual entries — ISA 240 relevant.  The orchestrator splits manual
# vs automated based on user-persona pool composition.
user_personas:
  enabled: true
  manual_entry_target_share: 0.21

internal_controls:
  enabled: true
  coso_enabled: true
  include_entity_level_controls: true
  target_maturity_level: managed
  exception_rate: 0.02
  sod_violation_rate: 0.01

distributions:
  enabled: true
  industry_profile: manufacturing
  amounts:
    enabled: true
    distribution_type: log_normal
    components:
      - { weight: 0.65, mu: 5.5, sigma: 1.3, label: "routine" }
      - { weight: 0.28, mu: 7.8, sigma: 0.9, label: "significant" }
      - { weight: 0.07, mu: 9.5, sigma: 0.6, label: "major" }
    benford_compliance: true

temporal_patterns:
  enabled: true
  business_days:
    enabled: true
    half_day_policy: half_day
    month_end_convention: modified_following
  calendars:
    regions: [US, DE, GB, SG, JP, BR]
  period_end:
    model: exponential
    month_end:   { start_day: -10, base_multiplier: 1.0, peak_multiplier: 3.5, decay_rate: 0.3 }
    quarter_end: { inherit_from: month_end, additional_multiplier: 1.5 }
    year_end:    { start_day: -15, peak_multiplier: 6.0 }

audit:
  enabled: false  # Audit data is published in a separate dataset

# Accounting-network edge-list export (v5.8.0+).  Method A produces
# exactly one edge per 2-line journal entry (≈60% of postings per
# Ivertowski 2024) and skips the multi-line Cartesian-product
# expansion that would otherwise blow the dataset to 200 M+ edges
# at the 1 M-line scale.  Confidence is exactly 1.0 on every edge.
graph_export:
  je_network:
    method: a

output:
  output_directory: "./output"
  formats: [csv, json]

# Default phase config (single-entity, no group consolidation).
# Banking / OCEL graph exports disabled — published in their own
# datasets; only the lightweight `graphs/je_network.csv` ships with
# this config.
